<main class="auth-layout"><div class="auth-art"><span class="eyebrow">YOUR SEAT IS WAITING</span><h1>Stories are<br><span>better together.</span></h1><p>Create your account and keep every ticket in one place.</p></div><section class="auth-card"><span class="eyebrow">JOIN THE CLUB</span><h2>Create account</h2><p class="muted">Your next night out starts here.</p><form id="register-form" class="form-stack"><label>Your name<input name="name" type="text" autocomplete="name" minlength="2" maxlength="60" placeholder="Alex Morgan" required></label><label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="At least 8 characters" required></label><p class="form-message" role="status"></p><button class="btn btn-primary btn-wide" type="submit">Create account <i class="fa-solid fa-arrow-right"></i></button></form><p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p></section></main>
